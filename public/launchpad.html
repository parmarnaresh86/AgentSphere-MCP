<head>

<title>AgentSphere</title>

<style>
@font-face{font-family:'72';font-weight:400;font-display:swap;src:url('https://cdn.jsdelivr.net/npm/@sap-theming/theming-base-content/content/Base/baseLib/baseTheme/fonts/72-Regular.woff2') format('woff2')}
@font-face{font-family:'72';font-weight:700;font-display:swap;src:url('https://cdn.jsdelivr.net/npm/@sap-theming/theming-base-content/content/Base/baseLib/baseTheme/fonts/72-Bold.woff2') format('woff2')}
@font-face{font-family:'72';font-weight:600;font-display:swap;src:url('https://cdn.jsdelivr.net/npm/@sap-theming/theming-base-content/content/Base/baseLib/baseTheme/fonts/72-Semibold.woff2') format('woff2')}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* ---------- Morning Horizon (light) ---------- */
:root{
  --font:'72','72full','Segoe UI',system-ui,-apple-system,sans-serif;
  --bg:#f5f6f7;
  --shell:#ffffff;
  --shell-border:#e5e5e5;
  --surface:#ffffff;
  --surface-alt:#eff1f2;
  --hover:#eaecee;
  --text:#1d2d3e;
  --text-2:#556b82;
  --text-3:#758ca4;
  --border:#d9d9d9;
  --brand:#0070f2;
  --brand-soft:#ebf8ff;
  --brand-ink:#0064d9;
  --pos:#256f3a;  --pos-soft:#f5fae5;
  --crit:#e76500; --crit-soft:#fff8d6;
  --neg:#aa0808;  --neg-soft:#ffeaf4;
  --info:#0070f2;
  --tile-shadow:0 0 .125rem 0 rgba(34,53,72,.15),0 .125rem .25rem 0 rgba(34,53,72,.15);
  --tile-shadow-hover:0 0 .125rem 0 rgba(34,53,72,.15),0 .5rem 1rem 0 rgba(34,53,72,.15);
  --pop-shadow:0 0 .125rem 0 rgba(34,53,72,.2),0 .75rem 2rem 0 rgba(34,53,72,.2);
  --focus:#0032a5;
  --r-tile:1rem;
  --r-md:.75rem;
  --r-sm:.5rem;
  --hero:linear-gradient(135deg,#e3f1ff 0%,#f2f7fd 45%,#f5f6f7 100%);
  /* module accents (SAP accent palette) */
  --a1:#0070f2; --a2:#07838f; --a3:#188918; --a4:#c35500; --a5:#8b47d7; --a6:#d20a0a; --a7:#1a8fa3; --a8:#5d36ff; --a9:#cc00dc;
}
/* ---------- Evening Horizon (dark) ---------- */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12171c; --shell:#1d232a; --shell-border:#2c3540; --surface:#1d232a; --surface-alt:#232b33; --hover:#2a333d;
    --text:#eaecee; --text-2:#a9b4be; --text-3:#8396a8; --border:#3a4552;
    --brand:#4db1ff; --brand-soft:#15283b; --brand-ink:#8cc9ff;
    --pos:#5dc122; --pos-soft:#1a2d17; --crit:#ffa42c; --crit-soft:#322712; --neg:#ff8888; --neg-soft:#35191c; --info:#4db1ff;
    --tile-shadow:0 0 .125rem 0 rgba(0,0,0,.5),0 .125rem .25rem 0 rgba(0,0,0,.4);
    --tile-shadow-hover:0 0 .125rem 0 rgba(0,0,0,.5),0 .5rem 1rem 0 rgba(0,0,0,.5);
    --pop-shadow:0 0 .125rem 0 rgba(0,0,0,.6),0 .75rem 2rem 0 rgba(0,0,0,.6);
    --focus:#8cc9ff;
    --hero:linear-gradient(135deg,#16283c 0%,#151d26 50%,#12171c 100%);
    --a1:#4db1ff; --a2:#3fd2d9; --a3:#7bd65b; --a4:#ffa42c; --a5:#c49bff; --a6:#ff8888; --a7:#5cd3e8; --a8:#9f8cff; --a9:#f27cfd;
  }
}
:root[data-theme="dark"]{
  --bg:#12171c; --shell:#1d232a; --shell-border:#2c3540; --surface:#1d232a; --surface-alt:#232b33; --hover:#2a333d;
  --text:#eaecee; --text-2:#a9b4be; --text-3:#8396a8; --border:#3a4552;
  --brand:#4db1ff; --brand-soft:#15283b; --brand-ink:#8cc9ff;
  --pos:#5dc122; --pos-soft:#1a2d17; --crit:#ffa42c; --crit-soft:#322712; --neg:#ff8888; --neg-soft:#35191c; --info:#4db1ff;
  --tile-shadow:0 0 .125rem 0 rgba(0,0,0,.5),0 .125rem .25rem 0 rgba(0,0,0,.4);
  --tile-shadow-hover:0 0 .125rem 0 rgba(0,0,0,.5),0 .5rem 1rem 0 rgba(0,0,0,.5);
  --pop-shadow:0 0 .125rem 0 rgba(0,0,0,.6),0 .75rem 2rem 0 rgba(0,0,0,.6);
  --focus:#8cc9ff;
  --hero:linear-gradient(135deg,#16283c 0%,#151d26 50%,#12171c 100%);
  --a1:#4db1ff; --a2:#3fd2d9; --a3:#7bd65b; --a4:#ffa42c; --a5:#c49bff; --a6:#ff8888; --a7:#5cd3e8; --a8:#9f8cff; --a9:#f27cfd;
}

html{font-size:16px}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:.125rem solid var(--focus);outline-offset:.125rem}
.fi{width:1rem;height:1rem;fill:currentColor;flex:none}

/* ================= Shell bar ================= */
.shell{position:sticky;top:0;z-index:40;background:var(--shell);border-bottom:1px solid var(--shell-border)}
.shellbar{height:3.25rem;display:flex;align-items:center;gap:.5rem;padding:0 1rem}
.logo{display:flex;align-items:center;gap:.625rem;padding:.25rem .5rem .25rem .25rem;border-radius:var(--r-sm)}
.logo:hover{background:var(--hover)}
.logo-mark{width:2rem;height:2rem;border-radius:.5rem;background:linear-gradient(135deg,#0070f2,#5d36ff);display:grid;place-items:center;overflow:hidden;flex:none}
.logo-mark img{width:100%;height:100%;object-fit:cover}
.logo-mark span{color:#fff;font-weight:700;font-size:.875rem}
.logo-title{font-weight:700;font-size:1rem;letter-spacing:-.01em}
.logo-sub{font-size:.875rem;color:var(--text-2);display:flex;align-items:center;gap:.25rem;padding-left:.625rem;border-left:1px solid var(--border)}
.shell-search{flex:1;display:flex;justify-content:center;min-width:0}
.search{position:relative;width:min(36rem,100%)}
.search input{width:100%;height:2.25rem;border-radius:1.125rem;border:1px solid var(--border);background:var(--surface-alt);color:var(--text);font:inherit;font-size:.875rem;padding:0 2.25rem 0 2.5rem;transition:border-color .15s,background .15s}
.search input::placeholder{color:var(--text-3)}
.search input:hover{border-color:var(--text-3)}
.search input:focus{outline:none;border-color:var(--brand);background:var(--surface);box-shadow:0 0 0 .1875rem var(--brand-soft)}
.search .fi{position:absolute;left:.875rem;top:50%;transform:translateY(-50%);color:var(--text-2)}
.search kbd{position:absolute;right:.625rem;top:50%;transform:translateY(-50%);font:inherit;font-size:.6875rem;color:var(--text-3);border:1px solid var(--border);border-radius:.25rem;padding:0 .3rem;line-height:1.1rem}
.shell-actions{display:flex;align-items:center;gap:.25rem}
.icon-btn{position:relative;width:2.25rem;height:2.25rem;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--text-2)}
.icon-btn:hover{background:var(--hover);color:var(--text)}
.icon-btn[aria-expanded="true"]{background:var(--brand-soft);color:var(--brand)}
.icon-btn .fi{width:1.125rem;height:1.125rem}
.badge{position:absolute;top:.25rem;right:.25rem;min-width:1rem;height:1rem;border-radius:.5rem;background:#d20a0a;color:#fff;font-size:.625rem;font-weight:700;display:grid;place-items:center;padding:0 .25rem;border:2px solid var(--shell)}
.copilot-btn{display:flex;align-items:center;gap:.375rem;height:2.25rem;padding:0 .875rem;border-radius:1.125rem;background:linear-gradient(135deg,#5d36ff,#0070f2);color:#fff;font-weight:600;font-size:.8125rem;margin-right:.25rem}
.copilot-btn:hover{filter:brightness(1.08)}
.avatar{width:2rem;height:2rem;border-radius:50%;background:#7858ff;color:#fff;font-size:.75rem;font-weight:700;display:grid;place-items:center;margin-left:.25rem}
.avatar-btn{border-radius:50%;padding:.125rem}
.avatar-btn:hover{box-shadow:0 0 0 .1875rem var(--hover)}

/* ================= Space tabs (Spaces & Pages menu) ================= */
.spacebar{display:flex;gap:.125rem;padding:0 1.5rem;overflow-x:auto;scrollbar-width:none}
.spacebar::-webkit-scrollbar{display:none}
.space-tab{position:relative;height:2.75rem;padding:0 .875rem;display:flex;align-items:center;gap:.4375rem;font-size:.875rem;color:var(--text-2);white-space:nowrap;border-radius:var(--r-sm) var(--r-sm) 0 0}
.space-tab:hover{color:var(--text);background:var(--hover)}
.space-tab .fi{width:.875rem;height:.875rem}
.space-tab[aria-selected="true"]{color:var(--brand);font-weight:700}
.space-tab[aria-selected="true"]::after{content:"";position:absolute;left:.5rem;right:.5rem;bottom:0;height:.1875rem;border-radius:.1875rem .1875rem 0 0;background:var(--brand)}
.space-tab .count{font-size:.6875rem;font-weight:600;color:var(--text-3);background:var(--surface-alt);border-radius:.5rem;padding:.0625rem .375rem}

/* ================= Page ================= */
main{max-width:100rem;margin:0 auto;padding:1.5rem 3rem 4rem}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;margin:.5rem 0 1.25rem;flex-wrap:wrap}
.page-title{font-size:1.5rem;font-weight:700;letter-spacing:-.01em}
.page-desc{color:var(--text-2);font-size:.875rem;margin-top:.25rem}
.seg{display:inline-flex;background:var(--surface-alt);border-radius:var(--r-sm);padding:.1875rem;gap:.125rem}
.seg button{height:1.75rem;padding:0 .75rem;border-radius:.375rem;font-size:.8125rem;color:var(--text-2);display:flex;align-items:center;gap:.375rem}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);font-weight:600;box-shadow:var(--tile-shadow)}

.section{margin-top:2rem}
.section:first-child{margin-top:0}
.section-head{display:flex;align-items:center;gap:.625rem;margin-bottom:.75rem}
.section-title{font-size:1rem;font-weight:700}
.section-meta{font-size:.75rem;color:var(--text-3)}
.section-head .link{margin-left:auto}
.link{color:var(--brand);font-size:.875rem;font-weight:600;border-radius:.25rem;padding:.125rem .25rem}
.link:hover{text-decoration:underline}

/* ================= Tiles (sap.m.GenericTile) ================= */
.tiles{display:flex;flex-wrap:wrap;gap:.5rem}
.tile{position:relative;width:11rem;height:11rem;background:var(--surface);border-radius:var(--r-tile);box-shadow:var(--tile-shadow);padding:1rem;display:flex;flex-direction:column;transition:box-shadow .2s,transform .2s}
.tile:hover{box-shadow:var(--tile-shadow-hover)}
.tile:active{transform:scale(.98)}
.tile.wide{width:22.5rem}
.tile-hit{position:absolute;inset:0;border-radius:var(--r-tile);z-index:1}
.tile-hit:focus-visible{outline-offset:-.125rem}
.tile-title{font-size:.875rem;font-weight:600;line-height:1.25rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding-right:1.25rem}
.tile-sub{font-size:.75rem;color:var(--text-2);line-height:1rem;margin-top:.25rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile-body{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:.5rem}
.tile-icon .fi{width:2rem;height:2rem;color:var(--brand)}
.tile-kpi{display:flex;align-items:baseline;gap:.25rem;line-height:1}
.tile-kpi .num{font-size:2.25rem;font-weight:400;letter-spacing:-.02em}
.tile-kpi .unit{font-size:.875rem;color:var(--text-2)}
.tile-kpi .pre{font-size:1.25rem;color:var(--text-2);align-self:flex-start;margin-top:.25rem}
.tile-kpi .arrow{font-size:.875rem;font-weight:700}
.tile-kpi.good .num,.tile-kpi.good .arrow{color:var(--pos)}
.tile-kpi.crit .num,.tile-kpi.crit .arrow{color:var(--crit)}
.tile-kpi.bad  .num,.tile-kpi.bad  .arrow{color:var(--neg)}
.tile-foot{font-size:.75rem;color:var(--text-3);margin-top:.5rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.has-kpi .tile-icon{align-self:flex-start;margin-top:.25rem}
.tile.has-kpi .tile-icon .fi{width:1.25rem;height:1.25rem;color:var(--text-3)}
.star{position:absolute;top:.625rem;right:.625rem;z-index:2;width:1.5rem;height:1.5rem;border-radius:.375rem;display:grid;place-items:center;color:var(--text-3);opacity:0;transition:opacity .15s}
.tile:hover .star,.star:focus-visible,.star[aria-pressed="true"]{opacity:1}
.star:hover{background:var(--hover)}
.star[aria-pressed="true"]{color:#e9a100}
.star svg{width:.875rem;height:.875rem;fill:currentColor}
.tag{display:inline-flex;align-items:center;gap:.25rem;height:1.25rem;padding:0 .5rem;border-radius:.625rem;font-size:.6875rem;font-weight:600}
.tag.soon{background:var(--surface-alt);color:var(--text-2)}
.tag.ai{background:linear-gradient(135deg,rgba(93,54,255,.14),rgba(0,112,242,.14));color:var(--a8)}
.tile.soon{background:var(--surface-alt);box-shadow:none;border:1px dashed var(--border)}
.tile.soon .tile-icon .fi{color:var(--text-3)}
.tile.soon .tile-title{color:var(--text-2)}

/* feature (wide) tile – copilot */
.tile.feature{background:linear-gradient(135deg,#3c1fd1 0%,#0057d2 60%,#0070f2 100%);color:#fff}
.tile.feature .tile-sub,.tile.feature .tile-foot{color:rgba(255,255,255,.82)}
.tile.feature .tile-icon .fi{color:#fff}
.tile.feature .star{color:rgba(255,255,255,.8)}
.tile.feature .star:hover{background:rgba(255,255,255,.15)}
.tile.feature .tag.ai{background:rgba(255,255,255,.18);color:#fff}

/* list view */
.applist{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--tile-shadow);overflow:hidden}
.applist-row{display:grid;grid-template-columns:2.5rem minmax(10rem,1.2fr) 2fr auto;align-items:center;gap:1rem;padding:.75rem 1rem;border-bottom:1px solid var(--surface-alt);text-align:left;width:100%}
.applist-row:last-child{border-bottom:0}
.applist-row:hover{background:var(--hover)}
.applist-row .ico{width:2.25rem;height:2.25rem;border-radius:.625rem;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.applist-row .ico .fi{width:1.125rem;height:1.125rem}
.applist-row .nm{font-weight:600;font-size:.875rem}
.applist-row .ds{font-size:.8125rem;color:var(--text-2)}
.applist-row.soon .nm{color:var(--text-2)}

/* ================= My Home ================= */
.hero{background:var(--hero);border-radius:var(--r-tile);padding:1.75rem 2rem;display:flex;align-items:center;justify-content:space-between;gap:1.5rem;flex-wrap:wrap;margin-bottom:2rem}
.hero h1{font-size:1.75rem;font-weight:700;letter-spacing:-.015em}
.hero p{color:var(--text-2);font-size:.875rem;margin-top:.375rem}
.hero-ask{display:flex;align-items:center;gap:.5rem;background:var(--surface);border-radius:1.5rem;box-shadow:var(--tile-shadow);padding:.375rem .375rem .375rem 1rem;width:min(30rem,100%)}
.hero-ask .fi{color:var(--a8)}
.hero-ask input{flex:1;border:0;background:none;font:inherit;font-size:.875rem;color:var(--text);min-width:0}
.hero-ask input:focus{outline:none}
.hero-ask input::placeholder{color:var(--text-3)}
.hero-ask button{height:2rem;padding:0 1rem;border-radius:1rem;background:var(--brand);color:#fff;font-weight:600;font-size:.8125rem}
:root[data-theme="dark"] .hero-ask button{color:#0b1520}
.chips{display:flex;gap:.375rem;flex-wrap:wrap;margin-top:.875rem}
.chip{height:1.75rem;padding:0 .75rem;border-radius:.875rem;background:var(--surface);border:1px solid var(--border);font-size:.75rem;color:var(--text-2)}
.chip:hover{border-color:var(--brand);color:var(--brand)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(17.5rem,1fr));gap:.75rem}
.card{background:var(--surface);border-radius:var(--r-tile);box-shadow:var(--tile-shadow);padding:1rem 1.125rem;display:flex;flex-direction:column;gap:.625rem;text-align:left;transition:box-shadow .2s}
.card:hover{box-shadow:var(--tile-shadow-hover)}
.card-top{display:flex;align-items:center;gap:.625rem}
.card-ico{width:2rem;height:2rem;border-radius:.625rem;display:grid;place-items:center;flex:none}
.card-ico .fi{width:1rem;height:1rem}
.card-ico.neg{background:var(--neg-soft);color:var(--neg)}
.card-ico.crit{background:var(--crit-soft);color:var(--crit)}
.card-ico.info{background:var(--brand-soft);color:var(--brand)}
.card-ico.pos{background:var(--pos-soft);color:var(--pos)}
.card-kind{font-size:.75rem;color:var(--text-2)}
.card-age{margin-left:auto;font-size:.75rem;color:var(--text-3)}
.card-title{font-size:.9375rem;font-weight:600;line-height:1.3}
.card-text{font-size:.8125rem;color:var(--text-2);line-height:1.4}
.card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:.25rem}
.card-foot .app{font-size:.75rem;color:var(--text-3);display:flex;align-items:center;gap:.375rem}
.card-foot .app .fi{width:.75rem;height:.75rem}

.apps-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:.5rem}
.app-chip{display:flex;align-items:center;gap:.75rem;background:var(--surface);border-radius:var(--r-md);box-shadow:var(--tile-shadow);padding:.625rem .75rem;text-align:left;transition:box-shadow .2s}
.app-chip:hover{box-shadow:var(--tile-shadow-hover)}
.app-chip .sq{width:2.5rem;height:2.5rem;border-radius:.75rem;display:grid;place-items:center;color:#fff;flex:none}
.app-chip .sq .fi{width:1.125rem;height:1.125rem}
.app-chip .nm{font-size:.8125rem;font-weight:600;line-height:1.2}
.app-chip .sp{font-size:.75rem;color:var(--text-2);margin-top:.125rem}
.empty{padding:1.5rem;border:1px dashed var(--border);border-radius:var(--r-md);color:var(--text-2);font-size:.875rem;text-align:center}

.insights{display:grid;grid-template-columns:repeat(auto-fill,minmax(17.5rem,1fr));gap:.75rem}
.ins{background:var(--surface);border-radius:var(--r-tile);box-shadow:var(--tile-shadow);padding:1rem 1.125rem}
.ins-h{display:flex;justify-content:space-between;align-items:baseline}
.ins-t{font-size:.875rem;font-weight:600}
.ins-s{font-size:.75rem;color:var(--text-3)}
.ins-v{font-size:1.75rem;margin-top:.5rem;letter-spacing:-.015em}
.ins-d{font-size:.75rem;font-weight:600;margin-left:.375rem}
.ins-d.up{color:var(--pos)} .ins-d.down{color:var(--neg)}
.ins svg.chart{width:100%;height:4.5rem;margin-top:.5rem;display:block}
.bars{display:flex;flex-direction:column;gap:.5rem;margin-top:.75rem}
.bar-row{display:grid;grid-template-columns:4.5rem 1fr 3.5rem;align-items:center;gap:.5rem;font-size:.75rem;color:var(--text-2)}
.bar-row .trk{height:.5rem;background:var(--surface-alt);border-radius:.25rem;overflow:hidden}
.bar-row .fil{height:100%;border-radius:.25rem}
.bar-row .v{text-align:right;color:var(--text);font-variant-numeric:tabular-nums}
.ins{display:flex;flex-direction:column}
.ins-foot{margin-top:auto;padding-top:.875rem;text-align:right}
.ins-axis{display:flex;justify-content:space-between;font-size:.6875rem;color:var(--text-3);margin-top:.25rem}
.ins-legend{display:flex;gap:.875rem;font-size:.75rem;color:var(--text-2);margin-top:.5rem}
.ins-legend i{display:inline-block;width:.5rem;height:.5rem;border-radius:.125rem;margin-right:.375rem}
.ins-split{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-top:.75rem}
.ins-split>div{background:var(--surface-alt);border-radius:var(--r-md);padding:.625rem .75rem}
.ins-split .k{font-size:.75rem;color:var(--text-2)}
.ins-split .n{font-size:1.25rem;margin-top:.25rem;font-variant-numeric:tabular-nums}
.ins-split .x{font-size:.75rem;color:var(--text-3);margin-top:.125rem}
.ins-split .x.bad{color:var(--neg);font-weight:600}
.bars.names .bar-row{grid-template-columns:minmax(0,7.5rem) 1fr 3.5rem}
.bars.names .bar-row>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alerts{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.75rem}
.alert{display:flex;align-items:center;gap:.5rem;height:2.25rem;padding:0 .875rem;border-radius:1.125rem;font-size:.8125rem;background:var(--surface);box-shadow:var(--tile-shadow)}
.alert:hover{box-shadow:var(--tile-shadow-hover)}
.alert b{font-variant-numeric:tabular-nums}
.alert .fi{width:.875rem;height:.875rem}
.alert.neg{color:var(--neg)} .alert.crit{color:var(--crit)}
.alert span{color:var(--text-2)}
/* clickable insight cards + drill targets */
.ins.clickable{cursor:pointer;transition:box-shadow .2s}
.ins.clickable:hover{box-shadow:var(--tile-shadow-hover)}
.ins.clickable:focus-visible,.sub:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.ins-foot{display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.ins-more{font-size:.75rem;color:var(--text-3)}
.ins.clickable:hover .ins-more{color:var(--brand)}
.sub{font:inherit;color:inherit;text-align:left;border-radius:var(--r-sm);cursor:pointer}
.sub:hover{background:var(--hover)}
.ins-legend .sub{display:inline-flex;align-items:center;padding:.125rem .25rem;margin:-.125rem -.25rem}
.ins-split .cell{display:flex;flex-direction:column;align-items:stretch}
.ins-split .cell .sub{display:block;width:100%;padding:0;margin:0}
.ins-split .cell .sub.x{margin-top:.125rem;padding:.0625rem .25rem;margin-left:-.25rem;width:auto}
.ins-split>button.cell{padding:.625rem .75rem;background:var(--surface-alt);border-radius:var(--r-md)}
.ins-split button.cell:hover{background:var(--hover)}
/* insight module groups + KPI tiles */
.ins-tabs{margin-bottom:.25rem;flex-wrap:wrap}
.ins-tabs .count{margin-left:.375rem;font-size:.6875rem;color:var(--text-3);font-weight:600}
.ins-group{margin-top:1.5rem}
.ins-group-head{display:flex;align-items:center;gap:.625rem;flex-wrap:wrap;margin-bottom:.75rem;padding-bottom:.5rem;border-bottom:1px solid var(--border)}
.ins-group-head h3{font-size:1rem;font-weight:700}
.ins-group-head .gi{width:1.75rem;height:1.75rem;border-radius:.5rem;display:grid;place-items:center;color:#fff;flex:none}
.ins-group-head .gi .fi{width:.875rem;height:.875rem}
.ins-group-head .gs{margin-left:auto;font-size:.75rem;color:var(--text-3)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(11.5rem,1fr));gap:.5rem;margin-bottom:.75rem}
.kpi{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--tile-shadow);padding:.75rem .875rem;cursor:pointer;transition:box-shadow .2s;min-width:0}
.kpi:hover{box-shadow:var(--tile-shadow-hover)}
.kpi:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.kpi-l{font-size:.75rem;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-v{font-size:1.375rem;margin-top:.25rem;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-s{display:flex;align-items:baseline;gap:.375rem;margin-top:.25rem;font-size:.6875rem;color:var(--text-3);white-space:nowrap;overflow:hidden}
.kpi-s .ins-d{margin-left:0;font-size:.6875rem}
.kpi-s span:not(.ins-d){overflow:hidden;text-overflow:ellipsis}
@media (max-width:640px){ .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} .ins-group-head .gs{margin-left:0;width:100%} }
/* detail pop-up */
.dt-modal{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;padding:1rem}
.dt-modal[hidden]{display:none}
.dt-back{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.dt-panel{position:relative;background:var(--surface);border-radius:var(--r-md);box-shadow:var(--pop-shadow);width:min(76rem,100%);min-width:0;max-height:calc(100vh - 2rem);display:flex;flex-direction:column;animation:pop .15s ease-out}
.dt-head{display:flex;align-items:flex-start;gap:1rem;padding:1rem 1.25rem .75rem;border-bottom:1px solid var(--surface-alt)}
.dt-head h2{font-size:1.125rem;font-weight:700}
.dt-head p{font-size:.8125rem;color:var(--text-2);margin-top:.125rem}
.dt-x{margin-left:auto;width:2rem;height:2rem;border-radius:var(--r-sm);font-size:1.25rem;line-height:1;color:var(--text-2);flex:none}
.dt-x:hover{background:var(--hover)}
.dt-tools{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;padding:.625rem 1.25rem;border-bottom:1px solid var(--surface-alt)}
.dt-tools input{height:2rem;border:1px solid var(--border);border-radius:var(--r-sm);padding:0 .625rem;font:inherit;font-size:.8125rem;background:var(--surface);color:var(--text);width:min(16rem,100%)}
.dt-tools .meta{font-size:.75rem;color:var(--text-3);margin-right:auto}
.dt-btn{height:2rem;padding:0 .875rem;border-radius:var(--r-sm);font-size:.8125rem;font-weight:600;border:1px solid var(--border);color:var(--brand);background:var(--surface)}
.dt-btn:hover{background:var(--hover)}
.dt-btn:disabled{opacity:.5;cursor:default}
.dt-btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
:root[data-theme="dark"] .dt-btn.primary{color:#0b1520}
.dt-body{overflow:auto;flex:1;min-height:8rem;min-width:0}
.dt-loading{padding:2rem;text-align:center;color:var(--text-2);font-size:.875rem}
table.dt{width:100%;border-collapse:collapse;font-size:.8125rem}
table.dt th{position:sticky;top:0;background:var(--surface-alt);text-align:left;font-weight:600;white-space:nowrap;z-index:1}
table.dt th button{font:inherit;color:var(--text-2);padding:.5rem .75rem;width:100%;text-align:inherit}
table.dt th button:hover{color:var(--brand)}
table.dt td{padding:.4375rem .75rem;border-bottom:1px solid var(--surface-alt);white-space:nowrap;max-width:15rem;overflow:hidden;text-overflow:ellipsis}
table.dt tbody tr:hover td{background:var(--hover)}
table.dt .num{text-align:right;font-variant-numeric:tabular-nums}
table.dt tfoot td{position:sticky;bottom:0;background:var(--surface);font-weight:700;border-top:2px solid var(--border)}
@media (max-width:640px){ .dt-modal{padding:0} .dt-panel{max-height:100vh;height:100%;border-radius:0} .dt-head,.dt-tools{padding-left:1rem;padding-right:1rem} .dt-tools input{width:100%} table.dt td{max-width:11rem} }

.note{margin-top:3rem;font-size:.75rem;color:var(--text-3);text-align:center}

/* ================= Popovers ================= */
.pop{position:fixed;z-index:60;background:var(--surface);border-radius:var(--r-md);box-shadow:var(--pop-shadow);width:22rem;max-width:calc(100vw - 2rem);display:none;overflow:hidden}
.pop.open{display:block;animation:pop .15s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-.25rem)}to{opacity:1;transform:none}}
.pop-h{padding:1rem 1.125rem .75rem;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--surface-alt)}
.pop-h b{font-size:1rem}
.notif{display:flex;gap:.75rem;padding:.875rem 1.125rem;border-bottom:1px solid var(--surface-alt)}
.notif:last-child{border-bottom:0}
.notif .dot{width:.5rem;height:.5rem;border-radius:50%;background:var(--brand);margin-top:.375rem;flex:none}
.notif .dot.read{background:transparent}
.notif .t{font-size:.8125rem;font-weight:600}
.notif .d{font-size:.75rem;color:var(--text-2);margin-top:.125rem;line-height:1.35}
.notif .w{font-size:.6875rem;color:var(--text-3);margin-top:.25rem}
.me{padding:1.25rem 1.125rem;display:flex;gap:.875rem;align-items:center;border-bottom:1px solid var(--surface-alt)}
.me .avatar{width:3rem;height:3rem;font-size:1rem;margin:0}
.me .n{font-weight:700}
.me .e{font-size:.75rem;color:var(--text-2);margin-top:.125rem}
.menu{padding:.375rem}
.menu-item{width:100%;display:flex;align-items:center;gap:.75rem;padding:.625rem .75rem;border-radius:var(--r-sm);font-size:.875rem;text-align:left}
.menu-item:hover{background:var(--hover)}
.menu-item .fi{color:var(--text-2)}
.menu-label{font-size:.6875rem;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;padding:.625rem .75rem .375rem}
.theme-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:.375rem;padding:0 .75rem .625rem}
.theme-opt{border:1px solid var(--border);border-radius:var(--r-sm);padding:.5rem .25rem;font-size:.75rem;display:flex;flex-direction:column;align-items:center;gap:.375rem}
.theme-opt[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand);color:var(--brand);font-weight:600}
.swatch{width:2.5rem;height:1.5rem;border-radius:.25rem;border:1px solid var(--border)}

/* ================= Toast ================= */
.toast{position:fixed;left:50%;bottom:2rem;transform:translate(-50%,1rem);background:#1d2d3e;color:#fff;padding:.75rem 1.25rem;border-radius:var(--r-sm);font-size:.875rem;opacity:0;pointer-events:none;transition:.2s;z-index:80;box-shadow:var(--pop-shadow);max-width:calc(100vw - 2rem)}
:root[data-theme="dark"] .toast{background:#eaecee;color:#1d2d3e}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ================= Responsive ================= */
@media (max-width:1024px){ main{padding:1.25rem 2rem 3rem} .logo-sub{display:none} .copilot-btn span{display:none} .copilot-btn{padding:0 .625rem} }
@media (max-width:640px){
  .shellbar{padding:0 .5rem;gap:.25rem}
  .logo-title{display:none}
  .search kbd{display:none}
  .spacebar{padding:0 .5rem}
  main{padding:1rem 1rem 3rem}
  .hero{padding:1.25rem}
  .hero h1{font-size:1.375rem}
  .tiles{gap:.5rem}
  .tile{width:calc(50% - .25rem);height:9.25rem;padding:.75rem;border-radius:.75rem}
  .tile.wide{width:100%}
  .tile-icon .fi{width:1.5rem;height:1.5rem}
  .tile-kpi .num{font-size:1.75rem}
  .applist-row{grid-template-columns:2.25rem 1fr auto}
  .applist-row .ds{display:none}
  #helpBtn{display:none}
}
</style>
</head>

};

const canIns = key => SUPER || PERMS.has('insights.' + key);

let BRAND = {productName:'AgentSphere', companyName:''};
let CUR = {code:'USD', symbol:'$'}, LOCALE = 'en-US', AGING = null, HOME = null;

async function api(url){
  const r = await fetch(url, { headers: { 'x-auth-token': TOKEN || '' } });
  if (r.status === 401) { signOutLocal(); throw new Error('401'); }
  if (!r.ok) throw new Error(String(r.status));
  return r.json();
}
function signOutLocal(){
  try { localStorage.removeItem('hanny_token'); localStorage.removeItem('hanny_user'); sessionStorage.removeItem('lp_inapp'); } catch {}
  location.replace('/login.html');
}

let state = {space: location.hash.slice(1) || 'home', view: store.get('view','tiles'), appsTab:'fav', insGroup: store.get('insGroup','all')};

/* ---------------- money (company currency) ---------------- */
function money(n){
  const iso = /^[A-Z]{3}$/.test(CUR.code || '');
  try {
    if (iso) return new Intl.NumberFormat(LOCALE, {style:'currency', currency:CUR.code, notation:'compact', maximumSignificantDigits:3}).format(n);
  } catch {}
  return (CUR.symbol || '') + new Intl.NumberFormat(LOCALE, {notation:'compact', maximumSignificantDigits:3}).format(n);
}

/* ---------------- tiles ---------------- */
function foot(t){ return t.f ? 'Quick create' : t.p ? 'Opens in AI chat' : ''; }
function tileHTML(t){
  const fav = favs.has(t.key);
  return `<article class="tile">
    <button class="tile-hit" data-open="${esc(t.key)}" aria-label="${esc(t.t)}"></button>
    <button class="star" data-fav="${esc(t.key)}" aria-pressed="${fav}" aria-label="${fav?'Remove from':'Add to'} favorites">${STAR}</button>
    <div class="tile-title">${esc(t.t)}</div>
    <div class="tile-sub">${esc(t.s)}</div>
    <div class="tile-body"><span class="tile-icon">${svg(t.i)}</span>${t.ai?'<span class="tag ai">AI</span>':''}</div>
    ${foot(t) ? `<div class="tile-foot">${foot(t)}</div>` : ''}
  </article>`;
}
function listHTML(tiles){
  return `<div class="applist">${tiles.map(t => `
    <button class="applist-row" data-open="${esc(t.key)}">
      <span class="ico">${svg(t.i)}</span>
      <span class="nm">${esc(t.t)}</span>
      <span class="ds">${esc(t.s)}</span>
      <span>${t.ai?'<span class="tag ai">AI</span>':foot(t)?`<span class="tag soon">${foot(t)}</span>`:''}</span>
    </button>`).join('')}</div>`;
}
const block = tiles => state.view === 'list' ? listHTML(tiles) : `<div class="tiles">${tiles.map(tileHTML).join('')}</div>`;

/* ---------------- space bar ---------------- */
function renderSpacebar(){
  const tabs = [{id:'home',label:'My Home',icon:'home'}, ...visibleSpaces()];
  $('#spacebar').innerHTML = tabs.map(s => {
    const n = s.sections ? s.sections.reduce((a,x)=>a+visibleTiles(x.tiles).length,0) : 0;
    return `<button class="space-tab" role="tab" data-space="${s.id}" aria-selected="${state.space===s.id}">${svg(s.icon)}${esc(s.label)}${n?`<span class="count">${n}</span>`:''}</button>`;
  }).join('');
}

/* ---------------- pages ---------------- */
function viewToggle(){
  return `<div class="seg" role="group" aria-label="Layout">
    <button data-view="tiles" aria-pressed="${state.view==='tiles'}">${svg('dimension')}Tiles</button>
    <button data-view="list" aria-pressed="${state.view==='list'}">${svg('list')}List</button></div>`;
}
function renderSpace(sp){
  const secs = sp.sections.map(sec => ({...sec, tiles: visibleTiles(sec.tiles)})).filter(sec => sec.tiles.length);
  const n = secs.reduce((a,x)=>a+x.tiles.length,0);
  return `<div class="page-head"><div><h1 class="page-title">${esc(sp.label)}</h1>
      <p class="page-desc">${n} app${n===1?'':'s'}</p></div>${viewToggle()}</div>

      <div class="section-head"><h2 class="section-title">${esc(sec.title)}</h2><span class="section-meta">${sec.tiles.length}</span></div>
      ${block(sec.tiles)}</section>`).join('')}`;
}
function greeting(){ const h = new Date().getHours(); return h<12?'Good morning':h<17?'Good afternoon':'Good evening'; }
const firstName = () => (USER.fullName || USER.full_name || USER.username || '').trim().split(/\s+/)[0] || '';

/* Every insight card is clickable: it opens a pop-up with the rows behind the
   figure (/api/home/insights/detail?key=…). Parts of a card can drill into a
   narrower list via their own data-detail. The footer link still opens the
   matching transaction screen when the user has one. */
const insCard = (key, label, inner) =>
  `<div class="ins clickable" data-detail="${esc(key)}" role="button" tabindex="0" aria-label="${esc(label)} — show details">${inner}</div>`;
function agingCard(title, total, overdue, buckets, openKey, detailKey){
  const rows = ['1-30','31-60','61-90','90+'].map(b => [b, buckets?.[b]?.amount || 0]);
  const max = Math.max(1, ...rows.map(r => r[1]));
  const colors = {'1-30':'--a1','31-60':'--a4','61-90':'--a6','90+':'--a6'};
  return insCard(detailKey, title, `
    <div class="ins-h"><span class="ins-t">${title}</span><span class="ins-s">Open balance</span></div>
    <div class="ins-v">${money(total)}</div>
    <div class="ins-s" style="margin-top:.25rem">${money(overdue)} overdue</div>
    <div class="bars">${rows.map(([b,v]) => `
      <div class="bar-row"><span>${b} days</span><span class="trk"><span class="fil" style="display:block;width:${(v/max*100).toFixed(1)}%;background:var(${colors[b]})"></span></span><span class="v">${money(v)}</span></div>`).join('')}</div>
    ${openLink(openKey)}`);
}
const openLink = key => { const t = TILE_BY_KEY[key]; return `<div class="ins-foot"><span class="ins-more">View details</span>${t && can(t) ? `<button class="link" data-open="${esc(key)}">${esc(t.t)}</button>` : ''}</div>`; };
const count = n => new Intl.NumberFormat(LOCALE).format(n);
function delta(pct, goodWhenUp = true){
  if (pct == null || !isFinite(pct)) return '';
  const up = pct >= 0, good = up === goodWhenUp;
  return `<span class="ins-d ${good?'up':'down'}">${up?'▲':'▼'} ${Math.abs(pct).toFixed(Math.abs(pct)<10?1:0)}%</span>`;
}
// 12-month area sparkline; the current (partial) month is drawn as a dot.
function sparkline(months, color){
  const vals = months.map(m => m.amount), max = Math.max(1, ...vals), n = vals.length;
  const pts = vals.map((v,i) => [(i/(n-1))*100, 38 - (v/max)*34]);
  const line = pts.map(p => p[0].toFixed(2)+','+p[1].toFixed(2)).join(' ');
  const last = pts[n-1];
  const title = months.map(m => `${m.label} ${m.y}: ${money(m.amount)}`).join('\n');
  return `<svg class="chart" viewBox="0 0 100 40" preserveAspectRatio="none" role="img" aria-label="12-month trend"><title>${esc(title)}</title>
    <polygon points="0,40 ${line} 100,40" fill="var(${color})" opacity=".12"/>
    <polyline points="${line}" fill="none" stroke="var(${color})" stroke-width="1.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="2.2" fill="var(${color})" vector-effect="non-scaling-stroke"/></svg>
    <div class="ins-axis"><span>${esc(months[0].label)} ${months[0].y}</span><span>${esc(months[n-1].label)}</span></div>`;
}
function trendCard(title, d, color, openKey, goodWhenUp, detailKey){
  return insCard(detailKey, title, `
    <div class="ins-h"><span class="ins-t">${title}</span><span class="ins-s">This month · excl. tax</span></div>
    <div class="ins-v">${money(d.mtd)}${delta(d.changePct, goodWhenUp)}</div>
    <div class="ins-s" style="margin-top:.25rem">${count(d.mtdCount)} invoice${d.mtdCount===1?'':'s'} · ${money(d.prevMtd)} same days last month</div>
    ${sparkline(d.months, color)}
    ${openLink(openKey)}`);
}
function cashCard(c){
  const max = Math.max(1, ...c.months.flatMap(m => [m.in, m.out])), n = c.months.length, w = 100/n, bw = w*.32;
  const bars = c.months.map((m,i) => {
    const x = i*w + w*.16, hi = m.in/max*36, ho = m.out/max*36;
    return `<rect x="${x}" y="${38-hi}" width="${bw}" height="${hi}" rx=".6" fill="var(--a3)"><title>${esc(m.label)} in: ${money(m.in)}</title></rect>
      <rect x="${x+bw+w*.04}" y="${38-ho}" width="${bw}" height="${ho}" rx=".6" fill="var(--a4)"><title>${esc(m.label)} out: ${money(m.out)}</title></rect>`;
  }).join('');
  const net = c.mtdIn - c.mtdOut;
  return insCard('cash-in', 'Cash flow', `
    <div class="ins-h"><span class="ins-t">Cash flow</span><span class="ins-s">Net this month</span></div>
    <div class="ins-v" style="color:var(${net<0?'--neg':'--pos'})">${net<0?'−':''}${money(Math.abs(net))}</div>
    <div class="ins-legend"><button class="sub" data-detail="cash-in"><i style="background:var(--a3)"></i>In ${money(c.mtdIn)}</button><button class="sub" data-detail="cash-out"><i style="background:var(--a4)"></i>Out ${money(c.mtdOut)}</button></div>
    <svg class="chart" viewBox="0 0 100 40" preserveAspectRatio="none" role="img" aria-label="Cash in vs out, last 6 months">${bars}</svg>
    <div class="ins-axis">${c.months.map(m=>`<span>${esc(m.label)}</span>`).join('')}</div>
    ${openLink('nav-ia-cashflow')}`);
}
function quotesCard(q){

    <div class="ins-h"><span class="ins-t">Open quotations</span><span class="ins-s">Awaiting order</span></div>

    <div class="ins-s" style="margin-top:.25rem">${money(q.amount)} pipeline value</div>

      <div class="cell"><div class="k">Still valid</div><div class="n">${count(q.count - q.late)}</div><div class="x">${money(q.amount - q.lateAmount)}</div></div>
      <button class="sub cell" data-detail="expired-quotes"><div class="k">Expired, still open</div><div class="n" style="color:var(${q.late?'--crit':'--text'})">${count(q.late)}</div><div class="x">${money(q.lateAmount)}</div></button>

}
function topListCard(title, sub, list, color, detailKey, openKey){
  const max = Math.max(1, ...list.map(c => c.amount)), total = list.reduce((a,c)=>a+c.amount,0);
  return insCard(detailKey, title, `
    <div class="ins-h"><span class="ins-t">${title}</span><span class="ins-s">${sub}</span></div>
    <div class="ins-s" style="margin-top:.25rem">Top ${list.length} = ${money(total)}</div>

/* ---------------- finance (general ledger, fiscal YTD vs same period last year) ---------------- */
const fin = v => v != null && isFinite(v);
const pctTxt = v => fin(v) ? `${v.toFixed(1)}%` : '—';
const ratioTxt = v => fin(v) ? `${v.toFixed(2)}×` : '—';
const daysTxt = v => fin(v) ? `${count(Math.round(v))} days` : '—';
const chg = (cur, ly) => fin(cur) && fin(ly) && ly ? (cur - ly) / Math.abs(ly) * 100 : null;
// Change in percentage points, for metrics that are already percentages.
function ppDelta(cur, ly, goodWhenUp = true){
  if (!fin(cur) || !fin(ly)) return '';
  const d = cur - ly, up = d >= 0;
  return `<span class="ins-d ${up === goodWhenUp ? 'up' : 'down'}">${up?'▲':'▼'} ${Math.abs(d).toFixed(1)} pp</span>`;
}
function kpiTile(k){
  return `<div class="kpi clickable" data-detail="${esc(k.key)}" role="button" tabindex="0" aria-label="${esc(k.label)} — show details">
    <div class="kpi-l">${esc(k.label)}</div>
    <div class="kpi-v"${k.tone ? ` style="color:var(${k.tone})"` : ''}>${k.value}</div>
    <div class="kpi-s">${k.delta || ''}${k.sub ? `<span>${k.sub}</span>` : ''}</div>
  </div>`;
}
function financeKpis(F){

  const cr = F.creditLimit || {count: 0, over: 0};
  const vsLy = 'vs last year', signed = v => fin(v) ? (v < 0 ? '−' : '') + money(Math.abs(v)) : '—';
  const k = [
    {need:'pnl', label:'Revenue', value:money(p.revenue), delta:delta(chg(p.revenue, pl.revenue)), sub:vsLy, key:'fin-revenue'},
    {need:'pnl', label:'Cost of sales', value:money(p.cogs), delta:delta(chg(p.cogs, pl.cogs), false), sub:vsLy, key:'fin-cogs'},
    {need:'pnl', label:'Gross profit', value:money(p.grossProfit), delta:delta(chg(p.grossProfit, pl.grossProfit)), sub:vsLy, key:'fin-pl'},
    {need:'pnl', label:'Gross margin', value:pctTxt(p.grossMarginPct), delta:ppDelta(p.grossMarginPct, pl.grossMarginPct), sub:vsLy, key:'fin-pl'},
    {need:'pnl', label:'Operating expenses', value:money(p.opex), delta:delta(chg(p.opex, pl.opex), false), sub:vsLy, key:'fin-opex'},
    {need:'pnl', label:'Opex to revenue', value:pctTxt(p.opexPct), delta:ppDelta(p.opexPct, pl.opexPct, false), sub:vsLy, key:'fin-expense-groups'},
    {need:'pnl', label:'EBITDA', value:signed(p.ebitda), delta:delta(chg(p.ebitda, pl.ebitda)), sub:vsLy, key:'fin-pl'},
    {need:'pnl', label:'EBITDA margin', value:pctTxt(p.ebitdaMarginPct), delta:ppDelta(p.ebitdaMarginPct, pl.ebitdaMarginPct), sub:vsLy, key:'fin-pl'},
    {need:'pnl', label:'Net profit', value:signed(p.netProfit), tone:p.netProfit < 0 ? '--neg' : null, delta:delta(chg(p.netProfit, pl.netProfit)), sub:vsLy, key:'fin-pl'},
    {need:'pnl', label:'Net margin', value:pctTxt(p.netMarginPct), delta:ppDelta(p.netMarginPct, pl.netMarginPct), sub:vsLy, key:'fin-pl'},

    {need:'balance', label:'Working capital', value:signed(b.workingCapital), delta:delta(chg(b.workingCapital, bl.workingCapital)), sub:'vs a year ago', key:'fin-wc'},
    {need:'ratios', label:'Current ratio', value:ratioTxt(b.currentRatio), sub:`${ratioTxt(bl.currentRatio)} a year ago`, key:'fin-ratios'},
    {need:'ratios', label:'Quick ratio', value:ratioTxt(b.quickRatio), sub:`${ratioTxt(bl.quickRatio)} a year ago`, key:'fin-ratios'},

    {need:'ratios', label:'Return on equity', value:pctTxt(r.roe), sub:'Trailing 12 months', key:'fin-ratios'},
    {need:'ratios', label:'Return on assets', value:pctTxt(r.roa), sub:'Trailing 12 months', key:'fin-ratios'},
    {need:'ratios', label:'Asset turnover', value:ratioTxt(r.assetTurnover), sub:'Revenue ÷ assets, TTM', key:'fin-ratios'},
    {need:'receivables', label:'Over credit limit', value:count(cr.count), tone:cr.count ? '--neg' : null, sub:cr.count ? `${money(cr.over)} over limit` : 'No customers', key:'fin-credit-limit'},
  ];
  if (AGING && canIns('finance.receivables') && fin(AGING.arOverduePct)) k.push({need:'receivables', label:'Receivables overdue', value:pctTxt(AGING.arOverduePct), tone:AGING.arOverduePct > 50 ? '--neg' : null, sub:`${money(AGING.arOverdue)} past due`, key:'ar-overdue'});

  return k.filter(t => F.allow?.[t.need]);
}
// 13-month revenue bars with the net profit line; the partial current month is faded.
function plTrendCard(F){
  const t = F.trend, n = t.length, w = 100 / n;
  const vals = t.flatMap(m => [m.revenue, m.netProfit]), max = Math.max(1, ...vals), min = Math.min(0, ...vals), span = max - min || 1;
  const y = v => 38 - ((v - min) / span) * 36, zero = y(0);
  const bars = t.map((m, i) => `<rect x="${(i*w + w*.18).toFixed(2)}" y="${Math.min(y(m.revenue), zero).toFixed(2)}" width="${(w*.64).toFixed(2)}" height="${Math.abs(zero - y(m.revenue)).toFixed(2)}" rx=".6" fill="var(--a1)" opacity="${m.partial ? .35 : .8}"><title>${esc(m.month)} revenue: ${money(m.revenue)}</title></rect>`).join('');
  const line = t.map((m, i) => `${(i*w + w/2).toFixed(2)},${y(m.netProfit).toFixed(2)}`).join(' ');
  const full = t.filter(m => !m.partial), last = full.at(-1);
  return insCard('fin-trend', 'Profit & loss trend', `
    <div class="ins-h"><span class="ins-t">Profit &amp; loss trend</span><span class="ins-s">Last 13 months</span></div>
    <div class="ins-v">${last ? money(last.netProfit) : '—'}</div>
    <div class="ins-s" style="margin-top:.25rem">Net profit ${last ? esc(last.month) : ''} · revenue ${last ? money(last.revenue) : '—'}</div>
    <div class="ins-legend"><span><i style="background:var(--a1)"></i>Revenue</span><span><i style="background:var(--a3)"></i>Net profit</span></div>
    <svg class="chart" viewBox="0 0 100 40" preserveAspectRatio="none" role="img" aria-label="Revenue and net profit, last 13 months">${bars}
      <line x1="0" x2="100" y1="${zero.toFixed(2)}" y2="${zero.toFixed(2)}" stroke="var(--border)" stroke-width="1" vector-effect="non-scaling-stroke"/>
      <polyline points="${line}" fill="none" stroke="var(--a3)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>
    <div class="ins-axis"><span>${esc(t[0].month)}</span><span>${esc(t[n-1].month)}</span></div>
    ${openLink('nav-financial-dashboard')}`);
}

function moneyFull(n){
  try { if (/^[A-Z]{3}$/.test(CUR.code||'')) return new Intl.NumberFormat(LOCALE,{style:'currency',currency:CUR.code}).format(n); } catch {}
  return (CUR.symbol||'') + new Intl.NumberFormat(LOCALE,{minimumFractionDigits:2,maximumFractionDigits:2}).format(n);
}
function fmtCell(v, type){
  if (v == null || v === '') return '';
  if (type === 'money') return moneyFull(Number(v));
  if (type === 'qty') return new Intl.NumberFormat(LOCALE,{maximumFractionDigits:3}).format(Number(v));
  if (type === 'int') return count(Number(v));
  if (type === 'pct') return isFinite(Number(v)) ? Number(v).toFixed(1) + '%' : '';
  if (type === 'date') { const d = new Date(String(v).slice(0,10)+'T00:00:00'); return isNaN(d) ? String(v) : d.toLocaleDateString(LOCALE,{day:'2-digit',month:'short',year:'numeric'}); }
  return String(v);
}
const isNum = t => t === 'money' || t === 'qty' || t === 'int' || t === 'pct';
function dtRows(){
  const {data, sort, dir, q} = DT; if (!data) return [];
  let rows = data.rows;
  if (q) { const ql = q.toLowerCase(); rows = rows.filter(r => data.cols.some(c => fmtCell(r[c.k], c.type).toLowerCase().includes(ql))); }
  if (sort) {
    const col = data.cols.find(c => c.k === sort);
    rows = [...rows].sort((a,b) => (isNum(col.type) ? Number(a[sort]||0) - Number(b[sort]||0)
      : String(a[sort]??'').localeCompare(String(b[sort]??''), LOCALE, {numeric:true})) * dir);
  }
  return rows;
}

  $('#dtBody').innerHTML = '<div class="dt-loading">Loading live data…</div>';
  const app = TILE_BY_KEY[DETAIL_APP[key]];
  $('#dtApp').hidden = !(app && can(app));
  if (app) { $('#dtApp').textContent = 'Open ' + app.t; $('#dtApp').dataset.open = app.key; }
  $('#dtModal').hidden = false; document.body.style.overflow = 'hidden';
  $('#dtClose').focus();
  try {
    const d = await api('/api/home/insights/detail?key=' + encodeURIComponent(key));
    if (DT.key !== key) return;
    DT.data = d;
    $('#dtTitle').textContent = d.title; $('#dtSub').textContent = d.sub || '';
    renderDetail();
  } catch (e) {
    if (DT.key !== key) return;
    $('#dtTitle').textContent = 'Could not load details';
    $('#dtBody').innerHTML = `<div class="empty" style="margin:1rem">${e.message === '403' ? 'You do not have access to this insight.' : 'The data could not be loaded. Check the database connection and try again.'}</div>`;
  }
}
function closeDetail(){
  if ($('#dtModal').hidden) return;
  $('#dtModal').hidden = true; document.body.style.overflow = ''; DT.key = null;
  try { dtReturnFocus?.focus(); } catch {}
}
function downloadDetail(){
  const {data} = DT; if (!data) return;
  const q = v => { const s = v == null ? '' : String(v); return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
  const csv = [data.cols.map(c => q(c.label)).join(','),
    ...dtRows().map(r => data.cols.map(c => q(c.type==='date' && r[c.k] ? String(r[c.k]).slice(0,10) : r[c.k])).join(','))].join('\r\n');
  const a = Object.assign(document.createElement('a'), {href: URL.createObjectURL(new Blob(['﻿'+csv], {type:'text/csv'})), download: `${DT.key}-${new Date().toISOString().slice(0,10)}.csv`});
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function renderHome(){
  const date = new Date().toLocaleDateString(LOCALE,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const pool = state.appsTab==='fav' ? [...favs] : recent;
  const apps = pool.map(k=>TILE_BY_KEY[k]).filter(t => t && can(t));
  const name = firstName();
  return `
  <section class="hero">
    <div><h1>${greeting()}${name?', '+esc(name):''}</h1><p>${esc(date)}${BRAND.companyName?' · '+esc(BRAND.companyName):''} · SAP Business One</p></div>
    <div style="width:min(30rem,100%)">
      <form class="hero-ask" id="askForm">${svg('ai')}<input id="askInput" placeholder="Ask ${esc(BRAND.agentName||'Henny')} about orders, stock, payments…" aria-label="Ask a question"><button type="submit">Ask</button></form>
      <div class="chips">${ASK_CHIPS.map(c=>`<button class="chip" data-ask="${esc(c)}">${esc(c)}</button>`).join('')}</div>
    </div>
  </section>

  <section class="section">
    <div class="section-head"><h2 class="section-title">Apps</h2>
      <div class="seg" role="group" aria-label="Apps" style="margin-left:.5rem">
        <button data-apps="fav" aria-pressed="${state.appsTab==='fav'}">Favorites</button>
        <button data-apps="recent" aria-pressed="${state.appsTab==='recent'}">Recently used</button></div></div>
    ${apps.length ? `<div class="apps-grid">${apps.map(a=>`
      <button class="app-chip" data-open="${esc(a.key)}"><span class="sq" style="background:var(${ACCENT[a.space.id]})">${svg(a.i)}</span>
        <span><div class="nm">${esc(a.t)}</div><div class="sp">${esc(a.space.label)}</div></span></button>`).join('')}</div>`
      : `<div class="empty">${state.appsTab==='fav' ? 'No favorites yet — hover any tile and click the star to pin it here.' : 'Apps you open will appear here.'}</div>`}
  </section>
  ${renderInsights()}`;
}
function renderSearch(q){
  const ql = q.toLowerCase();
  const bySpace = visibleSpaces().map(sp => ({sp, tiles: sp.sections.flatMap(s => visibleTiles(s.tiles)).filter(t => (t.t+' '+t.s+' '+sp.label).toLowerCase().includes(ql))})).filter(g=>g.tiles.length);
  const n = bySpace.reduce((a,g)=>a+g.tiles.length,0);
  return `<div class="page-head"><div><h1 class="page-title">Search results</h1><p class="page-desc">${n} app${n===1?'':'s'} for “${esc(q)}”</p></div>${viewToggle()}</div>
    ${bySpace.length ? bySpace.map(g=>`<section class="section"><div class="section-head"><h2 class="section-title">${esc(g.sp.label)}</h2><span class="section-meta">${g.tiles.length}</span></div>${block(g.tiles)}</section>`).join('')
      : `<div class="empty">No apps match. <button class="link" data-ask="${esc(q)}">Ask ${esc(BRAND.agentName||'Henny')} instead</button></div>`}`;
}
function render(){
  const q = $('#q').value.trim();
  const sp = visibleSpaces().find(s=>s.id===state.space);
  if (!sp) state.space = 'home';
  $('#main').innerHTML = q ? renderSearch(q) : sp ? renderSpace(sp) : renderHome();
  $('#crumb').textContent = q ? 'Search' : sp ? sp.label : 'Home';
  document.title = (sp ? sp.label + ' · ' : '') + (BRAND.productName || 'AgentSphere');
  renderSpacebar();
}
function renderUser(){
  const nm = USER.fullName || USER.full_name || USER.username || '';
  const ini = nm.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('') || '?';
  $('#meInitials').textContent = $('#meInitials2').textContent = ini;
  $('#meName').textContent = nm || 'Signed in';
  $('#meRole').textContent = [USER.role, BRAND.companyName].filter(Boolean).join(' · ');
  $('#meCompanySetup').hidden = !can(TILE_BY_KEY['nav-company-setup']) || !(SUPER || ['admin.users','admin.roles'].some(p=>PERMS.has(p)));
}

/* ---------------- navigation into the app ---------------- */
function go(qs){ try { sessionStorage.setItem('lp_inapp','1'); } catch {} location.href = '/?' + qs; }
function openApp(key){
  const t = TILE_BY_KEY[key]; if (!t || !can(t)) return;
  recent = [key, ...recent.filter(x=>x!==key)].slice(0,8); store.set(userKey()+'.recent', recent);
  go(t.o ? 'open=' + encodeURIComponent(t.o) : t.f ? 'form=' + encodeURIComponent(t.f) : 'prompt=' + encodeURIComponent(t.p));
}
function goSpace(space){ state.space = space; $('#q').value=''; history.replaceState(null,'','#'+space); render(); window.scrollTo({top:0}); }

let toastTimer;
function toast(msg){ const el=$('#toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),2200); }

document.addEventListener('click', e => {
  const dt = e.target.closest('[data-detail],[data-sort],[data-dtclose]');
  // data-open inside a card (its app link) wins over the card's own data-detail.
  if (dt && !(dt.dataset.detail && e.target.closest('[data-open]') && dt.contains(e.target.closest('[data-open]')))) {
    if (dt.dataset.dtclose) closeDetail();
    else if (dt.dataset.sort) { const k = dt.dataset.sort; DT.dir = DT.sort === k ? -DT.dir : 1; DT.sort = k; renderDetail(); }
    else openDetail(dt.dataset.detail);
    return;
  }
  const el = e.target.closest('[data-open],[data-fav],[data-space],[data-view],[data-apps],[data-ask],[data-go],[data-t],[data-refresh],[data-insgroup]');
  if (!el) return;
  const d = el.dataset;
  if (d.fav){ favs.has(d.fav) ? favs.delete(d.fav) : favs.add(d.fav); store.set(userKey()+'.favs',[...favs]); render(); toast(favs.has(d.fav)?'Added to favorites':'Removed from favorites'); }
  else if (d.open){ closeDetail(); openApp(d.open); }
  else if (d.space) goSpace(d.space);
  else if (d.view){ state.view=d.view; store.set('view',d.view); render(); }
  else if (d.apps){ state.appsTab=d.apps; render(); }
  else if (d.ask) go('ask=' + encodeURIComponent(d.ask));
  else if (d.go) go(d.go);
  else if (d.t) setTheme(d.t);
  else if (d.insgroup){ state.insGroup = d.insgroup; store.set('insGroup', d.insgroup); render(); }
  else if (d.refresh){ toast('Refreshing insights…'); loadInsights(); }
});
document.addEventListener('submit', e => { if (e.target.id==='askForm'){ e.preventDefault(); const v=$('#askInput').value.trim(); if(v) go('ask=' + encodeURIComponent(v)); } });
$('#q').addEventListener('input', render);
$('#dtFilter').addEventListener('input', e => { DT.q = e.target.value.trim(); renderDetail(); });
$('#dtCsv').addEventListener('click', downloadDetail);
$('#homeLogo').addEventListener('click', ()=>goSpace('home'));
$('#copilotBtn').addEventListener('click', ()=>go('chat=1'));
$('#signOut').addEventListener('click', async () => {
  try { await fetch('/auth/logout', { method:'POST', headers:{'x-auth-token': TOKEN || ''} }); } catch {}
  signOutLocal();
});
document.addEventListener('keydown', e => {
  if (e.key==='/' && !['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){ e.preventDefault(); $('#q').focus(); }
  if (!$('#dtModal').hidden){
    if (e.key==='Escape'){ e.preventDefault(); closeDetail(); return; }
    if (e.key==='Tab'){ // keep focus inside the pop-up
      const f = [...$('#dtModal').querySelectorAll('button:not([hidden]):not(:disabled),input')].filter(x => x.offsetParent);
      const i = f.indexOf(document.activeElement);
      if (e.shiftKey && i <= 0){ e.preventDefault(); f.at(-1).focus(); }
      else if (!e.shiftKey && i === f.length-1){ e.preventDefault(); f[0].focus(); }
    }
    return;
  }
  if ((e.key==='Enter' || e.key===' ') && document.activeElement?.matches('.clickable')){ e.preventDefault(); openDetail(document.activeElement.dataset.detail); return; }
  if (e.key==='Escape'){ closePops(); if(document.activeElement===$('#q') && $('#q').value){ $('#q').value=''; render(); } }
});
$('#spacebar').addEventListener('keydown', e => {
  if (!['ArrowLeft','ArrowRight'].includes(e.key)) return;
  const tabs=[...document.querySelectorAll('.space-tab')], i=tabs.indexOf(document.activeElement); if(i<0) return;
  const n=tabs[(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length]; n.click();
  document.querySelector(`.space-tab[data-space="${n.dataset.space}"]`)?.focus();
});

/* popovers */
function closePops(){ document.querySelectorAll('.pop.open').forEach(p=>p.classList.remove('open')); document.querySelectorAll('[aria-expanded="true"]').forEach(b=>b.setAttribute('aria-expanded','false')); }
function togglePop(btn, pop){
  const open = !pop.classList.contains('open'); closePops(); if(!open) return;
  const r = btn.getBoundingClientRect();
  pop.style.top = (r.bottom + 8) + 'px';
  pop.style.right = Math.max(16, window.innerWidth - r.right) + 'px';
  pop.classList.add('open'); btn.setAttribute('aria-expanded','true');
}
$('#meBtn').addEventListener('click', e => { e.stopPropagation(); togglePop(e.currentTarget, $('#mePop')); });
document.addEventListener('click', e => { if(!e.target.closest('.pop')) closePops(); });

/* light / dark (per browser) */
function setTheme(t){
  if (t==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
  store.set('theme', t);
  document.querySelectorAll('.theme-opt').forEach(b=>b.setAttribute('aria-pressed', b.dataset.t===t));
}

/* ---------------- boot ---------------- */
document.querySelectorAll('svg[data-i]').forEach(s => { s.setAttribute('viewBox','0 0 16 16'); s.innerHTML = `<path d="${ICONS[s.dataset.i]||''}"/>`; });
setTheme(store.get('theme','light'));
renderUser();
render();

// Live session + permissions
api('/auth/me').then(u => {
  USER = {...USER, ...u, id: u.user_id ?? USER.id, fullName: u.full_name ?? USER.fullName};
  PERMS = new Set(u.permissions || []); SUPER = !!u.isSuperAdmin;
  loadPrefs(); renderUser(); render();
  return loadInsights();
}).catch(() => {});

// Live KPIs for My Home. Each source fails on its own so one bad query
// never hides the rest; the server filters /api/home/insights by permission.
function loadInsights(){
  const finance = canIns('finance.receivables') || canIns('finance.payables');
  return api('/api/db-connections/status').then(s => {
    if (s.currency) { CUR = s.currency; LOCALE = CUR.code === 'INR' ? 'en-IN' : 'en-US'; setAppCurrency(s.currency); }
    if (!s.connected) return;
    return Promise.all([
      api('/api/home/insights').then(h => { HOME = h; }).catch(() => {}),
      finance ? api('/api/finance/aging').then(a => { AGING = a; }).catch(() => {}) : null,
    ]).then(() => { if (state.space === 'home') render(); });
  }).catch(() => {});
}

// Branding + theme: this page is the Fiori theme's home; HANA theme goes back to the chat UI
fetch('/api/branding').then(r => r.json()).then(b => {
  const theme = b.uiTheme === 'fiori' ? 'fiori' : 'hana';
  try { localStorage.setItem('ui_theme', theme); } catch {}
  if (theme !== 'fiori') { location.replace('/'); return; }
  BRAND = {...BRAND, ...b, agentName: b.productName || 'Henny'};
  if (b.productName) $('#brandName').textContent = b.productName;
  if (b.productLogo) $('#brandLogo').src = b.productLogo;
  $('#copilotLabel').textContent = 'Ask ' + BRAND.agentName;
  renderUser(); render();
}).catch(() => {});
</script>
</body>
</html>
