<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta http-equiv="Cache-Control" content="no-store"/>
<title>Purchase Request Agent — SAP B1</title>

<!-- Auth guard -->
<script>
(function(){
  const token = localStorage.getItem('hanny_token');
  if (!token) { window.location.replace('/login.html'); return; }
  fetch('/auth/me', { headers: { 'x-auth-token': token } })
    .then(r => { if (!r.ok) { localStorage.removeItem('hanny_token'); window.location.replace('/login.html'); } })
    .catch(() => {});
})();
</script>

<!-- Marked.js for markdown rendering -->
<script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --shell:#354A5E;
  --shell-hover:rgba(255,255,255,.10);
  --blue:#0070F2;
  --blue-light:#E8F4FF;
  --blue-mid:#0064D9;
  --bg:#F5F6F7;
  --white:#FFFFFF;
  --text:#32363A;
  --muted:#6A6D70;
  --border:#E5E5E5;
  --bot-bg:#FFFFFF;
  --user-bg:#E8F4FF;
  --green:#107E3E;
  --red:#BB0000;
  --orange:#E9730C;
  --font:'Segoe UI',system-ui,-apple-system,sans-serif;
  --r:4px;
  --shadow:0 2px 8px rgba(0,0,0,.08);
}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:var(--font);color:var(--text);display:flex;flex-direction:column}

/* ─── TOP SHELL BAR ──────────────────────────────────────────────────────── */
.shell-bar{
  background:var(--shell);height:44px;padding:0 16px;
  display:flex;align-items:center;gap:12px;flex-shrink:0;
  box-shadow:0 2px 4px rgba(0,0,0,.2);z-index:20;
}
.shell-back{
  display:flex;align-items:center;gap:6px;color:rgba(255,255,255,.75);
  text-decoration:none;font-size:12px;padding:4px 10px;border-radius:var(--r);
  transition:background .15s;border:1px solid rgba(255,255,255,.2);
}
.shell-back:hover{background:var(--shell-hover);color:#fff}
.shell-divider{width:1px;height:20px;background:rgba(255,255,255,.2)}
.shell-icon{
  width:28px;height:28px;border-radius:4px;background:var(--blue);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;flex-shrink:0;
}
.shell-title{font-size:14px;font-weight:600;color:#fff;letter-spacing:.1px}
.shell-subtitle{font-size:11px;color:rgba(255,255,255,.55);margin-left:6px}
.shell-spacer{flex:1}
.shell-badge{
  font-size:9.5px;padding:2px 8px;border-radius:10px;
  background:rgba(0,112,242,.5);color:#fff;font-weight:600;letter-spacing:.2px;
}
.shell-reset-btn{
  display:flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);
  color:rgba(255,255,255,.75);border-radius:var(--r);padding:4px 10px;
  font-size:11px;cursor:pointer;transition:all .15s;
}
.shell-reset-btn:hover{background:rgba(187,0,0,.4);color:#fff;border-color:rgba(187,0,0,.5)}

/* ─── MAIN LAYOUT ─────────────────────────────────────────────────────────── */
.main-area{display:flex;flex:1;min-height:0;overflow:hidden}

/* ─── CHAT PANEL ──────────────────────────────────────────────────────────── */
.chat-panel{
  display:flex;flex-direction:column;flex:1;min-width:0;
  border-right:1px solid var(--border);
}

.chat-topbar{
  background:var(--white);border-bottom:1px solid var(--border);
  padding:8px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0;
}
.chat-topbar-avatar{
  width:32px;height:32px;border-radius:50%;background:var(--blue);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;flex-shrink:0;
}
.chat-topbar-info{flex:1}
.chat-topbar-name{font-size:13px;font-weight:600;color:var(--text)}
.chat-topbar-status{font-size:11px;color:var(--green);display:flex;align-items:center;gap:4px}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0}
.step-badge{
  font-size:10px;padding:2px 8px;border-radius:10px;background:#F5F6F7;
  border:1px solid var(--border);color:var(--muted);font-weight:600;
}

#messages{
  flex:1;overflow-y:auto;padding:16px 20px;
  display:flex;flex-direction:column;gap:12px;
  background:var(--bg);scroll-behavior:smooth;
}
#messages::-webkit-scrollbar{width:5px}
#messages::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}

/* ─── MESSAGES ───────────────────────────────────────────────────────────── */
.msg-row{display:flex;gap:8px;max-width:820px;width:100%;align-self:flex-start}
.msg-row.user{align-self:flex-end;flex-direction:row-reverse}
.av{
  width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:12px;flex-shrink:0;margin-top:2px;font-weight:700;
}
.av.bot{background:var(--blue);color:#fff}
.av.user{background:var(--blue-light);color:var(--blue);border:1px solid #99CAFF}
.bubble{
  padding:10px 14px;border-radius:var(--r);line-height:1.65;
  font-size:13.5px;max-width:100%;box-shadow:var(--shadow);
}
.bubble.bot{
  background:var(--white);border:1px solid var(--border);
  border-top-left-radius:0;color:var(--text);
}
.bubble.user{
  background:var(--blue);color:#fff;border-top-right-radius:0;
}
/* Markdown inside bot bubble */
.bubble.bot table{border-collapse:collapse;width:100%;margin:8px 0;font-size:12.5px}
.bubble.bot th{background:#F5F6F7;padding:6px 10px;text-align:left;font-size:11px;font-weight:700;color:var(--muted);border-bottom:2px solid var(--border);border-right:1px solid var(--border)}
.bubble.bot td{padding:5px 10px;border-bottom:1px solid #F0F0F0;border-right:1px solid #F0F0F0}
.bubble.bot tr:last-child td{border-bottom:none}
.bubble.bot tr:hover td{background:var(--blue-light)}
.bubble.bot h2{font-size:15px;font-weight:700;color:var(--blue);margin:4px 0 8px;border-bottom:2px solid var(--blue-light);padding-bottom:4px}
.bubble.bot h3{font-size:13.5px;font-weight:700;color:var(--blue);margin:8px 0 4px}
.bubble.bot h4{font-size:12.5px;font-weight:700;color:var(--text);margin:8px 0 4px}
.bubble.bot strong{font-weight:700;color:var(--text)}
.bubble.bot em{font-style:italic;color:var(--muted);font-size:12.5px}
.bubble.bot blockquote{border-left:3px solid var(--blue);background:var(--blue-light);padding:8px 12px;margin:8px 0;border-radius:0 var(--r) var(--r) 0;font-size:12.5px;color:var(--text)}
.bubble.bot code{background:#F5F6F7;border-radius:2px;padding:1px 5px;font-size:12px;font-family:'Courier New',monospace;color:#32363A;border:1px solid var(--border)}
.bubble.bot ul,.bubble.bot ol{padding-left:18px;margin:4px 0}
.bubble.bot li{margin:2px 0}
.bubble.bot a{color:var(--blue);text-decoration:none;font-weight:500}
.bubble.bot a:hover{text-decoration:underline}
.bubble.bot hr{border:none;border-top:1px solid var(--border);margin:10px 0}
.bubble.bot p{margin:4px 0}

/* print link styling */
.bubble.bot a[href*="/print/"]{
  display:inline-flex;align-items:center;gap:5px;margin-top:8px;
  padding:5px 12px;background:var(--blue-light);color:var(--blue);
  border:1px solid #99CAFF;border-radius:var(--r);font-size:12px;font-weight:600;
}
.bubble.bot a[href*="/print/"]:hover{background:var(--blue);color:#fff}

/* ─── QUICK REPLIES ──────────────────────────────────────────────────────── */
.qr-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:2px;padding-left:40px}
.qr-chip{
  background:var(--white);border:1px solid var(--blue);
  color:var(--blue);border-radius:20px;padding:5px 14px;
  font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;
  white-space:nowrap;
}
.qr-chip:hover{background:var(--blue);color:#fff}
.qr-chip.used{opacity:.45;cursor:default;pointer-events:none}

/* ─── TYPING INDICATOR ───────────────────────────────────────────────────── */
.typing-row{display:flex;gap:8px;align-self:flex-start}
.typing-bubble{
  background:var(--white);border:1px solid var(--border);
  border-radius:var(--r);border-top-left-radius:0;padding:12px 16px;
  display:flex;align-items:center;gap:5px;box-shadow:0 1px 4px rgba(0,0,0,.08);
}
.dot{width:7px;height:7px;border-radius:50%;background:#94a3b8;animation:bounce 1.2s infinite ease-in-out}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,80%,100%{transform:scale(.7);opacity:.4}40%{transform:scale(1);opacity:1}}

/* ─── INPUT AREA ─────────────────────────────────────────────────────────── */
.input-area{
  background:var(--white);border-top:1px solid var(--border);
  padding:8px 16px 12px;flex-shrink:0;
}
.input-row{
  display:flex;align-items:flex-end;gap:8px;
  background:var(--bg);border:1px solid var(--border);
  border-radius:var(--r);padding:6px 10px;
  transition:border-color .15s,box-shadow .15s;
}
.input-row:focus-within{
  border-color:var(--blue);box-shadow:0 0 0 2px rgba(0,112,242,.15);
  background:var(--white);
}
#user-input{
  flex:1;background:transparent;border:none;outline:none;
  color:var(--text);font-size:13.5px;font-family:var(--font);
  resize:none;max-height:100px;line-height:1.5;min-height:22px;
}
#user-input::placeholder{color:#ABABAB}
.send-btn{
  width:34px;height:34px;background:var(--blue);color:#fff;
  border:none;border-radius:var(--r);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:background .15s;
}
.send-btn:hover{background:var(--blue-mid)}
.send-btn:disabled{background:#cbd5e1;cursor:not-allowed}
.input-hint{font-size:11px;color:var(--muted);margin-top:5px;text-align:right}

/* ─── PR SUMMARY PANEL ───────────────────────────────────────────────────── */
.summary-panel{
  width:340px;flex-shrink:0;display:flex;flex-direction:column;
  background:var(--white);overflow:hidden;
}
.summary-header{
  background:var(--shell);padding:12px 16px;flex-shrink:0;
}
.summary-title{font-size:13px;font-weight:700;color:#fff;margin-bottom:2px}
.summary-sub{font-size:10.5px;color:rgba(255,255,255,.6)}
.summary-body{flex:1;overflow-y:auto;padding:12px}
.summary-body::-webkit-scrollbar{width:4px}
.summary-body::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:2px}

.summary-empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;gap:12px;color:var(--muted);text-align:center;padding:24px;
}
.summary-empty-icon{font-size:40px;opacity:.35}
.summary-empty-text{font-size:12.5px;line-height:1.6}

/* PR header info box */
.pr-info-box{
  border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;margin-bottom:12px;
  font-size:12px;
}
.pr-info-row{display:flex;justify-content:space-between;align-items:center;padding:3px 0;border-bottom:1px solid #F5F6F7}
.pr-info-row:last-child{border-bottom:none}
.pr-info-label{color:var(--muted);font-size:11px}
.pr-info-val{font-weight:600;color:var(--text);font-size:12px}

/* PR items list */
.pr-items-label{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted);letter-spacing:.06em;margin-bottom:8px}
.pr-item-card{
  border:1px solid var(--border);border-radius:var(--r);padding:8px 10px;
  margin-bottom:6px;background:var(--bg);transition:border-color .15s;
}
.pr-item-card:hover{border-color:var(--blue)}
.pr-item-code{font-size:11.5px;font-weight:700;color:var(--blue)}
.pr-item-name{font-size:11px;color:var(--text);margin:1px 0;line-height:1.3}
.pr-item-meta{
  display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;
}
.pr-meta-chip{
  font-size:10px;padding:2px 6px;border-radius:10px;
  background:var(--blue-light);color:var(--blue);font-weight:500;
}
.pr-meta-chip.whs{background:#E8F8F0;color:var(--green)}
.pr-meta-chip.new{background:#FFF5E5;color:var(--orange)}

/* Grand total row */
.pr-total{
  border-top:2px solid var(--border);margin-top:10px;padding-top:10px;
  display:flex;justify-content:space-between;align-items:center;
}
.pr-total-label{font-size:12px;font-weight:700;color:var(--text)}
.pr-total-val{font-size:14px;font-weight:700;color:var(--blue)}

/* Success state */
.pr-success{
  border:2px solid var(--green);border-radius:var(--r);padding:14px;
  background:#E8F8F0;margin-bottom:12px;
}
.pr-success-title{font-size:13px;font-weight:700;color:var(--green);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.pr-success-row{display:flex;justify-content:space-between;padding:3px 0;font-size:12px;border-bottom:1px solid rgba(0,0,0,.06)}
.pr-success-row:last-child{border-bottom:none}
.pr-success-label{color:var(--muted)}
.pr-success-val{font-weight:600;color:var(--text)}
.print-btn-panel{
  width:100%;margin-top:12px;padding:8px;background:var(--shell);color:#fff;
  border:none;border-radius:var(--r);cursor:pointer;font-size:12.5px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:6px;transition:background .15s;
  text-decoration:none;
}
.print-btn-panel:hover{background:#0070F2}

/* Step progress */
.step-progress{margin-bottom:12px}
.step-progress-label{font-size:10.5px;color:var(--muted);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.step-dots{display:flex;gap:4px;flex-wrap:wrap}
.step-dot{
  width:8px;height:8px;border-radius:50%;background:var(--border);
  transition:background .3s;
}
.step-dot.done{background:var(--blue)}
.step-dot.current{background:var(--blue);box-shadow:0 0 0 3px rgba(0,112,242,.25)}
.step-dot.pending{background:var(--border)}

/* Responsive */
@media(max-width:768px){
  .summary-panel{display:none}
}
</style>

<body>

<!-- ── SHELL BAR ───────────────────────────────────────────────────────────── -->
<div class="shell-bar">
  <a class="shell-back" href="/index.html">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
    Back
  </a>
  <div class="shell-divider"></div>
  <div class="shell-icon">🛒</div>
  <div>
    <div class="shell-title">Purchase Request Agent</div>
  </div>
  <span class="shell-subtitle">SAP B1 AI Requisition Wizard</span>
  <div class="shell-spacer"></div>
  <span class="shell-badge" id="step-badge">READY</span>
  <button class="shell-reset-btn" onclick="resetSession()">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
    New PR
  </button>
</div>

<!-- ── MAIN AREA ───────────────────────────────────────────────────────────── -->
<div class="main-area">

  <!-- ── CHAT PANEL ─────────────────────────────────────────────────────────── -->
  <div class="chat-panel">

    <!-- Chat top bar -->
    <div class="chat-topbar">
      <div class="chat-topbar-avatar">🤖</div>
      <div class="chat-topbar-info">
        <div class="chat-topbar-name">PR Assistant</div>
        <div class="chat-topbar-status">
          <span class="status-dot"></span>
          <span id="status-text">Ready to create purchase request</span>
        </div>
      </div>
    </div>

    <!-- Messages -->
    <div id="messages"></div>

    <!-- Input area -->
    <div class="input-area">
      <div class="input-row">
        <textarea id="user-input" rows="1" placeholder="Type your reply here…" autocomplete="off"></textarea>
        <button class="send-btn" id="send-btn" onclick="sendFromInput()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
      <div class="input-hint">Press <strong>Enter</strong> to send &nbsp;|&nbsp; <strong>Shift+Enter</strong> for new line</div>
    </div>

  </div>

  <!-- ── PR SUMMARY PANEL ────────────────────────────────────────────────────── -->
  <div class="summary-panel">
    <div class="summary-header">
      <div class="summary-title">📋 PR Builder</div>
      <div class="summary-sub">Live purchase request preview</div>
    </div>
    <div class="summary-body" id="summary-body">
      <div class="summary-empty">
        <div class="summary-empty-icon">📄</div>
        <div class="summary-empty-text">Your purchase request details will appear here as you chat with the agent.</div>
      </div>
    </div>
  </div>

</div><!-- end .main-area -->

<script>
// ─── State ────────────────────────────────────────────────────────────────────
let sessionId = null;
let isBusy = false;
let currentQuickReplies = [];
let prState = { prLines: [], vendor: null, dueDate: null, result: null };

const STEP_LABELS = {
  INIT: 'READY', ITEM_TYPE: 'ITEM TYPE', ITEM_SEARCH: 'ITEM SEARCH',
  ITEM_SELECT: 'ITEM SELECT', ITEM_QTY: 'QTY', WAREHOUSE: 'WAREHOUSE',
  ADD_MORE_ITEMS: 'ADD ITEMS', NEW_ITEM_CODE: 'NEW ITEM', NEW_ITEM_NAME: 'NEW ITEM',
  NEW_ITEM_QTY: 'NEW ITEM QTY', NEW_ITEM_WAREHOUSE: 'NEW WAREHOUSE',
  VENDOR: 'VENDOR', VENDOR_SELECT: 'VENDOR SELECT', DUE_DATE: 'DATE',
  COMMENTS: 'COMMENTS', CONFIRM: 'CONFIRM', POSTING: 'POSTING', DONE: 'DONE',
};

const STEP_SEQUENCE = ['ITEM_TYPE','ITEM_SEARCH','ITEM_SELECT','ITEM_QTY','WAREHOUSE',
  'ADD_MORE_ITEMS','VENDOR','DUE_DATE','COMMENTS','CONFIRM','POSTING','DONE'];

// ─── Marked.js config ─────────────────────────────────────────────────────────
function setupMarked() {
  if (typeof marked === 'undefined') return;
  marked.setOptions({
    breaks: true,
    gfm: true,
  });
  // Override link rendering to open print links in new tab
  const renderer = new marked.Renderer();
  renderer.link = (href, title, text) => {
    const isPrint = typeof href === 'string' && href.includes('/print/');
    const target = isPrint ? ' target="_blank" rel="noopener"' : '';
    return `<a href="${href}"${title ? ` title="${title}"` : ''}${target}>${text}</a>`;
  };
  marked.use({ renderer });
}

function renderMd(text) {
  if (typeof marked === 'undefined') return text.replace(/\n/g, '<br>');
  try { return marked.parse(text); } catch { return text; }
}

// ─── Message rendering ────────────────────────────────────────────────────────
function appendMessage(role, content, quickReplies) {
  const msgs = document.getElementById('messages');

  // Remove welcome placeholder if present
  const placeholder = msgs.querySelector('.welcome-placeholder');
  if (placeholder) placeholder.remove();

  const row = document.createElement('div');
  row.className = `msg-row ${role}`;

  const initials = role === 'bot' ? '🤖' : '👤';
  const avClass  = role === 'bot' ? 'bot' : 'user';

  row.innerHTML = `
    <div class="av ${avClass}">${initials}</div>
    <div class="bubble ${role === 'bot' ? 'bot' : 'user'}">${
      role === 'bot' ? renderMd(content) : escHtml(content)
    }</div>`;

  msgs.appendChild(row);

  // Quick replies
  if (quickReplies && quickReplies.length) {
    const qrDiv = document.createElement('div');
    qrDiv.className = 'qr-row';
    currentQuickReplies = quickReplies;
    quickReplies.forEach(qr => {
      const chip = document.createElement('button');
      chip.className = 'qr-chip';
      chip.textContent = qr;
      chip.onclick = () => {
        markQuickRepliesUsed();
        sendMessage(qr);
      };
      qrDiv.appendChild(chip);
    });
    msgs.appendChild(qrDiv);
  }

  msgs.scrollTop = msgs.scrollHeight;
}

function markQuickRepliesUsed() {
  document.querySelectorAll('.qr-chip:not(.used)').forEach(c => c.classList.add('used'));
}

function showTyping() {
  const msgs = document.getElementById('messages');
  const row = document.createElement('div');
  row.className = 'typing-row';
  row.id = 'typing-indicator';
  row.innerHTML = `
    <div class="av bot">🤖</div>
    <div class="typing-bubble">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>`;
  msgs.appendChild(row);
  msgs.scrollTop = msgs.scrollHeight;
}

function hideTyping() {
  const t = document.getElementById('typing-indicator');
  if (t) t.remove();
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── API call ─────────────────────────────────────────────────────────────────
async function sendMessage(msg) {
  if (isBusy) return;
  isBusy = true;
  setBusy(true);

  if (msg.trim()) appendMessage('user', msg);

  showTyping();

  try {
    const token = localStorage.getItem('hanny_token') || '';
    const body = JSON.stringify({ message: msg, sessionId });
    const r = await fetch('/api/pr-agent/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-auth-token': token },
      body,
    });
    const data = await r.json();
    hideTyping();

    if (!data.ok) {
      appendMessage('bot', `❌ Error: ${data.error || 'Unknown error'}`);
    } else {
      sessionId = data.sessionId;
      appendMessage('bot', data.reply, data.quickReplies || []);
      updateStep(data.step);
      if (data.prLines !== undefined) {
        prState.prLines = data.prLines;
        prState.vendor  = data.vendor;
        prState.dueDate = data.dueDate;
      }
      if (data.meta?.docEntry) {
        prState.result = data.meta;
      }
      updateSummaryPanel(data.step);
    }
  } catch (e) {
    hideTyping();
    appendMessage('bot', `⚠️ Connection error: ${e.message}`);
  } finally {
    isBusy = false;
    setBusy(false);
  }
}

function setBusy(busy) {
  const btn = document.getElementById('send-btn');
  const inp = document.getElementById('user-input');
  btn.disabled = busy;
  inp.disabled = busy;
  document.getElementById('status-text').textContent = busy ? 'Thinking…' : 'Ready';
}

// ─── Input handling ───────────────────────────────────────────────────────────
function sendFromInput() {
  const inp = document.getElementById('user-input');
  const msg = inp.value.trim();
  if (!msg || isBusy) return;
  inp.value = '';
  inp.style.height = 'auto';
  markQuickRepliesUsed();
  sendMessage(msg);
}

document.addEventListener('DOMContentLoaded', () => {
  setupMarked();

  const inp = document.getElementById('user-input');
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendFromInput();
    }
  });
  inp.addEventListener('input', () => {
    inp.style.height = 'auto';
    inp.style.height = Math.min(inp.scrollHeight, 100) + 'px';
  });

  // Start session automatically
  startSession();
});

function startSession() {
  sessionId = null;
  prState = { prLines: [], vendor: null, dueDate: null, result: null };
  document.getElementById('messages').innerHTML = '';
  document.getElementById('summary-body').innerHTML = `
    <div class="summary-empty">
      <div class="summary-empty-icon">📄</div>
      <div class="summary-empty-text">Your purchase request details will appear here as you chat with the agent.</div>
    </div>`;
  updateStep('INIT');
  sendMessage('');
}

async function resetSession() {
  if (sessionId) {
    try {
      const token = localStorage.getItem('hanny_token') || '';
      await fetch('/api/pr-agent/reset', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-auth-token': token },
        body: JSON.stringify({ sessionId }),
      });
    } catch {}
  }
  startSession();
}

// ─── Step badge ────────────────────────────────────────────────────────────────
function updateStep(step) {
  const badge = document.getElementById('step-badge');
  if (badge) badge.textContent = STEP_LABELS[step] || step || 'READY';
}

// ─── PR Summary panel ─────────────────────────────────────────────────────────
function updateSummaryPanel(step) {
  const panel = document.getElementById('summary-body');
  if (!panel) return;
  const { prLines, vendor, dueDate, result } = prState;

  // Show success state if PR was posted
  if (result?.docEntry) {
    panel.innerHTML = buildSuccessPanel(result, prLines, vendor, dueDate);
    return;
  }

  if (!prLines.length && !vendor && !dueDate) {
    panel.innerHTML = `
      <div class="step-progress">
        <div class="step-progress-label">Progress</div>
        ${buildStepDots(step)}
      </div>
      <div class="summary-empty">
        <div class="summary-empty-icon">💬</div>
        <div class="summary-empty-text">Answer the agent's questions to build your purchase request. Items will appear here as you add them.</div>
      </div>`;
    return;
  }

  let html = `
    <div class="step-progress">
      <div class="step-progress-label">Progress</div>
      ${buildStepDots(step)}
    </div>`;

  // Header info
  html += `<div class="pr-info-box">
    <div class="pr-info-row"><span class="pr-info-label">Date</span><span class="pr-info-val">${new Date().toISOString().slice(0,10)}</span></div>
    <div class="pr-info-row"><span class="pr-info-label">Required By</span><span class="pr-info-val">${dueDate || '—'}</span></div>
    <div class="pr-info-row"><span class="pr-info-label">Vendor</span><span class="pr-info-val">${vendor ? vendor.cardCode : 'Open'}</span></div>
  </div>`;

  // Items
  if (prLines.length) {
    html += `<div class="pr-items-label">Items (${prLines.length})</div>`;
    let grand = 0;
    prLines.forEach((l, i) => {
      const lineTotal = (l.qty || 0) * (l.unitPrice || 0);
      grand += lineTotal;
      html += `<div class="pr-item-card">
        <div class="pr-item-code">${escHtml(l.itemCode)}</div>
        <div class="pr-item-name">${escHtml(l.itemName || '—')}</div>
        <div class="pr-item-meta">
          <span class="pr-meta-chip">Qty: ${l.qty}</span>
          <span class="pr-meta-chip">${l.unit || 'EA'}</span>
          ${l.warehouseCode ? `<span class="pr-meta-chip whs">${escHtml(l.warehouseCode)}</span>` : ''}
          ${l.isNew ? `<span class="pr-meta-chip new">NEW</span>` : ''}
          ${l.unitPrice > 0 ? `<span class="pr-meta-chip">${fmtN(lineTotal)}</span>` : ''}
        </div>
      </div>`;
    });
    if (grand > 0) {
      html += `<div class="pr-total">
        <span class="pr-total-label">Est. Total</span>
        <span class="pr-total-val">${fmtN(grand)}</span>
      </div>`;
    }
  }

  panel.innerHTML = html;
}

function buildSuccessPanel(result, prLines, vendor, dueDate) {
  let html = `<div class="pr-success">
    <div class="pr-success-title">✅ PR Created!</div>
    <div class="pr-success-row"><span class="pr-success-label">Document #</span><span class="pr-success-val">${result.docNum}</span></div>
    <div class="pr-success-row"><span class="pr-success-label">Entry</span><span class="pr-success-val">${result.docEntry}</span></div>
    <div class="pr-success-row"><span class="pr-success-label">Lines</span><span class="pr-success-val">${prLines.length}</span></div>
    <div class="pr-success-row"><span class="pr-success-label">Vendor</span><span class="pr-success-val">${vendor ? vendor.cardCode : 'Open'}</span></div>
    <div class="pr-success-row"><span class="pr-success-label">Required By</span><span class="pr-success-val">${dueDate || '—'}</span></div>
  </div>
  <a class="print-btn-panel" href="/api/pr-agent/print/${result.docEntry}" target="_blank">
    🖨️ Print Requisition PR #${result.docNum}
  </a>`;

  if (prLines.length) {
    html += `<div style="margin-top:14px"><div class="pr-items-label">Items Requisitioned</div>`;
    prLines.forEach(l => {
      html += `<div class="pr-item-card">
        <div class="pr-item-code">${escHtml(l.itemCode)}</div>
        <div class="pr-item-name">${escHtml(l.itemName || '—')}</div>
        <div class="pr-item-meta">
          <span class="pr-meta-chip">Qty: ${l.qty} ${l.unit || 'EA'}</span>
          ${l.warehouseCode ? `<span class="pr-meta-chip whs">${escHtml(l.warehouseCode)}</span>` : ''}
        </div>
      </div>`;
    });
    html += `</div>`;
  }
  return html;
}

function buildStepDots(currentStep) {
  const steps = ['ITEM_TYPE','ITEM_SEARCH','ITEM_QTY','WAREHOUSE','ADD_MORE_ITEMS','VENDOR','DUE_DATE','COMMENTS','CONFIRM','DONE'];
  const curIdx = steps.indexOf(currentStep);
  let dots = '';
  steps.forEach((s, i) => {
    const cls = i < curIdx ? 'done' : i === curIdx ? 'current' : 'pending';
    dots += `<div class="step-dot ${cls}" title="${STEP_LABELS[s] || s}"></div>`;
  });
  return `<div class="step-dots">${dots}</div>`;
}

function fmtN(n, d = 2) {
  if (n == null || isNaN(Number(n))) return '—';
  return Number(n).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
}
</script>
</body>
</html>
